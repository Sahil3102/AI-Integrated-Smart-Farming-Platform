{% extends 'base.html' %}

{% block title %}Delete Crop - SmartAgri AI{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-exclamation-triangle text-4xl text-red-600"></i>
            </div>
            
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Delete Crop?</h1>
            <p class="text-gray-600 mb-2">
                Are you sure you want to delete <strong>{{ object.name }}</strong>?
            </p>
            <p class="text-gray-500 text-sm mb-8">
                This action cannot be undone.
            </p>
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-lg font-semibold hover:bg-red-700 transition">
                    <i class="fas fa-trash mr-2"></i>Yes, Delete
                </button>
                <a href="{% url 'farmer:crop_list' %}" class="block w-full bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
