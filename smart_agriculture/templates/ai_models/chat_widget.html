<div id="ai-chat-widget" class="fixed bottom-6 right-6 z-50">
    <!-- Chat Button -->
    <button id="chat-toggle-btn"
        class="bg-green-600 text-white rounded-full p-4 shadow-lg hover:bg-green-700 transition-colors duration-300 focus:outline-none flex items-center justify-center border-2 border-white"
        aria-label="Toggle Chat">
        <i class="fas fa-comment-dots text-2xl text-gray-900"></i>
    </button>

    <!-- Chat Window -->
    <div id="chat-window"
        class="hidden absolute bottom-20 right-0 w-80 sm:w-96 bg-white rounded-lg shadow-2xl border border-gray-200 overflow-hidden flex flex-col transition-all duration-300 transform origin-bottom-right">
        <!-- Header -->
        <div class="bg-green-600 text-white p-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fas fa-robot text-xl"></i>
                <h3 class="font-bold text-lg">AI Assistant</h3>
            </div>
            <button id="chat-close-btn" class="text-white hover:text-gray-200 focus:outline-none">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 p-4 space-y-4 overflow-y-auto h-80 bg-gray-50 flex flex-col pt-10">
            <!-- Loading Indicator -->
            <div id="loadingIndicator"
                class="hidden fixed top-2 p-3 bg-blue-100 text-blue-700 rounded-lg right-2 left-2 z-[60] shadow">
                Connecting to AI services...
            </div>

            <!-- Default Welcome Message -->
            <div class="flex items-end">
                <div
                    class="bg-white px-4 py-2 rounded-lg rounded-bl-none shadow border border-gray-100 max-w-[85%] text-sm text-gray-800">
                    <p>Hello! I am the Smart Agriculture Platform AI Assistant. How can I help you today? I can speak in
                        any language!</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-white border-t border-gray-200">
            <form id="chat-form" class="flex space-x-2">
                {% csrf_token %}
                <input type="text" id="chat-input"
                    class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 text-sm"
                    placeholder="Ask me anything..." required autocomplete="off">
                <button type="submit"
                    class="bg-green-600 text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-green-700 transition-colors focus:outline-none flex-shrink-0">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const chatWidget = document.getElementById('ai-chat-widget');
        const toggleBtn = document.getElementById('chat-toggle-btn');
        const closeBtn = document.getElementById('chat-close-btn');
        const chatWindow = document.getElementById('chat-window');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const messagesContainer = document.getElementById('chat-messages');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // Check if user is authenticated (using a global variable often set in base.html)
        const isAuthenticated = {% if user.is_authenticated %}true{% else %}false{% endif %};

    if (!isAuthenticated) {
        chatWidget.style.display = 'none'; // Hide if not logged in
        return;
    }

    // Toggle chat window
    function toggleChat() {
        chatWindow.classList.toggle('hidden');
        if (!chatWindow.classList.contains('hidden')) {
            chatInput.focus();
            scrollToBottom();
        }
    }

    toggleBtn.addEventListener('click', toggleChat);
    closeBtn.addEventListener('click', toggleChat);

    // Utility: Scroll to bottom
    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Add a message to the UI
    function appendMessage(text, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `flex ${isUser ? 'justify-end items-end' : 'items-end'}`;

        const bubbleDiv = document.createElement('div');
        bubbleDiv.className = `px-4 py-2 rounded-lg shadow max-w-[85%] text-sm ${isUser
            ? 'bg-green-600 text-white rounded-br-none'
            : 'bg-white text-gray-800 border border-gray-100 rounded-bl-none'
            }`;

        // Basic markdown handling (bold, newlines)
        let formattedText = text.replace(/\n/g, '<br>');
        formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        // Use DOMPurify if available in the main app to prevent XSS, else trust the AI
        bubbleDiv.innerHTML = formattedText;

        messageDiv.appendChild(bubbleDiv);
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
    }

    // Show/Hide typing indicator
    function setTyping(isTyping) {
        if (isTyping) {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'flex items-end';
            typingDiv.innerHTML = `
                    <div class="bg-gray-200 px-4 py-2 rounded-lg rounded-bl-none shadow max-w-[85%] flex space-x-1">
                        <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce"></div>
                        <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce delay-75"></div>
                        <div class="w-2 h-2 bg-gray-500 rounded-full animate-bounce delay-150"></div>
                    </div>
                `;
            messagesContainer.appendChild(typingDiv);
            scrollToBottom();
        } else {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }
    }

    // Handle form submission
    chatForm.addEventListener('submit', async function (e) {
        e.preventDefault();

        const message = chatInput.value.trim();
        if (!message) return;

        // Clear input and show user message
        chatInput.value = '';
        appendMessage(message, true);

        // Show typing indicator
        setTyping(true);

        try {
            const csrfElement = document.querySelector('[name=csrfmiddlewaretoken]');
            const csrfToken = csrfElement ? csrfElement.value : '';

            // Get JWT token if available in local storage
            const jwtToken = localStorage.getItem('access_token');

            const headers = {
                'Content-Type': 'application/json',
            };

            if (csrfToken) {
                headers['X-CSRFToken'] = csrfToken;
            }

            if (jwtToken) {
                headers['Authorization'] = `Bearer ${jwtToken}`;
            }

            const response = await fetch("{% url 'ai_models:api_chat' %}", {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({ message: message })
            });

            setTyping(false);

            if (!response.ok) {
                throw new Error(`Server returned ${response.status}`);
            }

            const data = await response.json();
            appendMessage(data.message || 'Sorry, I did not understand that.');

        } catch (error) {
            console.error('Chat error:', error);
            setTyping(false);
            appendMessage("Sorry, I'm having trouble connecting right now. Please try again later.", false);
        }
    });
    });
</script>
