{% extends 'base.html' %}

{% block title %}Set New Password - SmartAgri AI{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-key text-3xl text-green-600"></i>
                </div>
                <h2 class="text-3xl font-bold text-gray-800">Set New Password</h2>
                <p class="text-gray-500 mt-2">Enter your new password below</p>
            </div>
            
            <form method="post" class="space-y-6">
                {% csrf_token %}
                
                <div>
                    <label for="id_new_password" class="block text-sm font-medium text-gray-700 mb-2">
                        New Password
                    </label>
                    {{ form.new_password }}
                </div>
                
                <div>
                    <label for="id_confirm_password" class="block text-sm font-medium text-gray-700 mb-2">
                        Confirm Password
                    </label>
                    {{ form.confirm_password }}
                </div>
                
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition duration-200">
                    Reset Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
